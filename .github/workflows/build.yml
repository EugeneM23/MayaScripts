# Every push that changes the plugin becomes a SkeldarAnim build on the
# repository's Releases page, marked Latest. Maya's hub > Update >
# Check update reads releases/latest/download/version.json and, when the
# commit differs from the installed copy's, downloads SkeldarAnim.zip.
#
# A build is named for the last commit that touched the PAYLOAD
# (install.git_record), not for HEAD: a push of CLAUDE.md or a spec
# changes nothing a colleague receives, so it builds nothing.
#
# Spec: docs/superpowers/specs/2026-09-28-update-button-design.md

name: build

on:
  push:
    branches: [feature/overrig-picker]
    paths:
      - "SkeldarAnim/**"
      - "make_build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, none cancelled: the last push's build is the
# last release, which is what "Latest" has to mean.
concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP: 10          # builds kept on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the record's log and the notes read history

      # make_build.py is stdlib only; the runner's own python3 is enough.
      - name: Build
        run: python3 make_build.py --out dist/SkeldarAnim.zip --version-out dist/version.json

      - name: Already published?
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(python3 -c "import json; print(json.load(open('dist/version.json'))['short'])")
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -q -- "-$short\$"; then
            echo "build $short is published already (the push touched the workflow or the builder only)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Notes
        if: steps.known.outputs.skip != '1'
        env:
          BEFORE: ${{ github.event.before }}
          SHORT: ${{ steps.known.outputs.short }}
        run: |
          {
            echo "Plugin at \`$SHORT\`, built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git log --format='- `%h` %s' "$BEFORE..$GITHUB_SHA" -- SkeldarAnim
            else
              git log -1 --format='- `%h` %s' "$GITHUB_SHA" -- SkeldarAnim
            fi
            echo
            echo "Install: unzip, drag \`SkeldarAnim/install.py\` into a Maya viewport."
            echo "Update: SkeldarAnim window > Update > Check update."
          } > dist/notes.md
          cat dist/notes.md

      - name: Release
        if: steps.known.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.known.outputs.short }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M%S)-$SHORT"
          gh release create "$tag" dist/SkeldarAnim.zip dist/version.json \
            --target "$GITHUB_SHA" \
            --title "SkeldarAnim $(date -u +%Y-%m-%d) $SHORT" \
            --notes-file dist/notes.md \
            --latest

      - name: Prune
        if: steps.known.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '(env.KEEP | tonumber) as $k | [.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[$k:] | .[].tagName' |
          while read -r tag; do
            echo "pruning $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
