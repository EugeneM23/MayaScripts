<title>Time Bar Play Glow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One dark stage: the Time Bar as it sits in Maya, the glow played on a loop. */
:root{
  --bg:#141517; --panel:#202125; --track:#17181a; --line:#2c2e33;
  --text:#d6d8de; --muted:#8a8e98; --accent:#e07a36; --key:#e07a36; --rim:#fff1e2;
  --body:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:18px}
h1{font-size:18px;margin:0;font-weight:600}
p{margin:0;color:var(--muted);max-width:65ch;line-height:1.5}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
canvas{width:100%;height:56px;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--body);color:var(--text);background:#2a2c31;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:#3a2a1f;border-color:var(--accent);color:#f3c9a6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<div class="wrap">
  <h1>Play glow, variant B</h1>
  <p>Drawn the way the Time Bar draws it: added accent light filling in from the timeline's edge, peaking at 84 ms and gone by 700 ms. Press Play, or let it loop.</p>
  <div class="strip"><canvas id="tl" aria-label="Timeline"></canvas></div>
  <div class="row">
    <button id="play">▶ Play</button>
    <button id="loop" class="on">Loop</button>
    <button id="slow">Slow ×4</button>
    <span class="meta" id="meta">glow 0.00</span>
  </div>
</div>
<script>
const MS=700, PEAK=.55, RISE=.12, DEPTH=18, RING=.30, RIM=.4, RADIUS=6;
const cv=document.getElementById('tl'), ctx=cv.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let start=null, slow=1, loop=true, frame=10, lastLoop=0;
const keys=[0,6,12,30,40], F0=0, F1=48;
function glow(u){ if(u==null||u<0||u>=1) return 0;
  if(u<RISE) return PEAK*u/RISE; const v=(u-RISE)/(1-RISE); return PEAK*Math.pow(1-v,1.6); }
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function size(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);}
function draw(now){
  const w=cv.clientWidth,h=cv.clientHeight; ctx.clearRect(0,0,w,h);
  ctx.fillStyle=css('--track'); rr(1,1,w-2,h-2,RADIUS); ctx.fill();
  const cell=(w-2)/(F1-F0+1);
  ctx.fillStyle='#5a5e68'; ctx.font='10px '+css('--mono');
  for(let f=F0;f<=F1;f++){const x=1+cell*(f-F0)+cell/2; ctx.fillRect(x-.5,h-(f%5?5:9),1,f%5?4:8); if(f%10==0) ctx.fillText(f,x+2,h-11);}
  ctx.fillStyle=css('--key'); keys.forEach(k=>{const x=1+cell*k; const g=Math.min(3,cell*.18); rr(x+g/2+cell*.1,4,cell*.8-g,h-22,1.5); ctx.fill();});
  const hx=1+cell*(frame|0); ctx.fillStyle=rgba(css('--accent'),.28); ctx.fillRect(hx,1,cell,h-2);
  ctx.fillStyle=css('--accent'); ctx.fillRect(hx,1,cell,2); ctx.fillRect(hx,h-3,cell,2);
  const u=start==null?null:(now-start)/(MS*slow), level=glow(u);
  document.getElementById('meta').textContent=`glow ${level.toFixed(2)}  ·  ${start==null?0:Math.min(MS,(now-start)/slow).toFixed(0)} ms`;
  if(level>0){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=1;
    for(let i=0;i<DEPTH;i++){const k=1-i/DEPTH,a=level*k*k*RING,inset=1.5+i; if(2*inset>=Math.min(w,h)) break;
      ctx.strokeStyle=rgba(css('--accent'),a); rr(inset,inset,w-2*inset,h-2*inset,Math.max(1,RADIUS-i*.3)); ctx.stroke();}
    ctx.strokeStyle=rgba(css('--rim'),level*RIM); rr(1.75,1.75,w-3.5,h-3.5,RADIUS); ctx.stroke(); ctx.restore();
  } else if(u!=null && u>=1) start=null;
  if(start!=null) frame=Math.min(F1,frame+.25/slow);
  if(loop && start==null && now-lastLoop>1800/ (slow>1?.5:1)){lastLoop=now; frame=10; start=now;}
  requestAnimationFrame(draw);
}
document.getElementById('play').onclick=()=>{frame=10;start=performance.now();lastLoop=start;};
document.getElementById('loop').onclick=e=>{loop=!loop;e.target.classList.toggle('on',loop);};
document.getElementById('slow').onclick=e=>{slow=slow===1?4:1;e.target.classList.toggle('on',slow>1);};
addEventListener('resize',size); size(); requestAnimationFrame(draw);
</script>
